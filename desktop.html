<!doctype html>
<html lang="ru" data-app="desktop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Наша кухня — компьютер</title>
  <meta name="description" content="Наши рецепты, меню недели, покупки и расходы — версия для компьютера">
  <meta name="theme-color" content="#c2562f">
  <link rel="manifest" href="manifest-desktop.webmanifest">
